name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-artifact-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run contract tests
        run: python -m pytest -q

      - name: Compile Python scripts
        run: python -m compileall -q skills tests

      - name: Parse YAML references
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.yaml"):
              if "tmp" not in path.parts:
                  with path.open(encoding="utf-8") as handle:
                      yaml.safe_load(handle)
          print("YAML parse passed")
          PY

      - name: Exercise disclosure PDF contract
        shell: bash
        run: |
          set -euo pipefail
          python skills/modeling-ai-use-disclosure/scripts/build_disclosure_pdf.py \
            --input tests/fixtures/modeling-ai-use-disclosure/draft_input.json \
            --output /tmp/ai-disclosure-draft.pdf
          python skills/modeling-ai-use-disclosure/scripts/validate_disclosure.py \
            --input tests/fixtures/modeling-ai-use-disclosure/draft_input.json \
            --pdf /tmp/ai-disclosure-draft.pdf
