profile_id: research-full
label: 完整研究档
purpose: 需要完整留痕、复盘和跨会话交接的数模项目
collaboration_policy:
  default_mode: full
  user_intent_priority: true
  allow_provisional_work: true
  artifact_visibility: mixed
  review_completion: every_stage
principles_preserved:
  - human_decision_gates
  - evidence_before_prose
  - topic_specificity
  - reproducibility
  - truthful_ai_disclosure
artifact_policy:
  state: separate_stage_artifacts
  checkpoint: every_stage_and_major_revision
  event_granularity: per_source_or_interaction
  retain_raw_local_logs: true
review_policy:
  lenses:
    - substantive
    - claim_evidence
    - terminology
    - figure_table
    - ai_pattern
    - anti_homogenization
    - reader_experience
  max_post_draft_lenses: all
human_gates:
  - topic_selection
  - problem_familiarization
  - problem_intake
  - assumption_ledger
  - data_audit
  - model_architect
  - experiment_validator
  - ai_disclosure
  - final_preflight
  - process_freezer
review_gates:
  - rules_profile
  - literature_evidence
  - distinctiveness_coach
  - paper_architect
  - figure_design
  - figure_table
  - claim_evidence
  - terminology
  - draft
  - paper_review
  - ai_pattern
  - anti_homogenization
  - reader
  - naturalizer
  - support
