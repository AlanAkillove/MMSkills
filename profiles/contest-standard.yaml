profile_id: contest-standard
label: 比赛标准档
purpose: 在比赛周期内保留可复核主链并合并低风险过程材料
collaboration_policy:
  default_mode: standard
  user_intent_priority: true
  allow_provisional_work: true
  artifact_visibility: mixed
  review_completion: before_final_adoption
principles_preserved:
  - human_decision_gates
  - evidence_before_prose
  - topic_specificity
  - reproducibility
  - truthful_ai_disclosure
artifact_policy:
  state: shared_state_with_named_checkpoints
  checkpoint: every_human_gate_and_revision_boundary
  event_granularity: per_stage_with_source_index
  retain_raw_local_logs: true
review_policy:
  lenses:
    - substantive
    - claim_evidence
    - terminology
    - figure_table
    - ai_pattern
    - anti_homogenization
    - reader_experience
  max_post_draft_lenses: 4
  selection_rule: select_by_open_risks_and_human_confirmed_scope
human_gates:
  - topic_selection
  - problem_familiarization
  - problem_intake
  - assumption_ledger
  - model_architect
  - experiment_validator
  - ai_disclosure
  - final_preflight
  - process_freezer
review_gates:
  - paper_review
  - figure_table
  - claim_evidence
  - terminology
  - reader
  - naturalizer
  - support
