schema_version: "0.3.2"
kind: manuscript_writing_profile
profile_id: cumcm-natural-cn
not_official_rules: true
applies_with_rules_profiles:
  - cumcm-2026
source_note: >
  这是 MMSkills 的中文 CUMCM 写作策略，不是组委会官方格式规范。
  官方页数、摘要页、目录和文内引用义务以 rules profile 为准。

abstract:
  english_abstract: false
  organization: problem_by_problem
  reason: >
    2026 官方只规定摘要无需译成英文、原则上不超过一页。
    本 profile 进一步要求不写英文摘要，并按子问写成自然段，便于评委建立问题—方法—结果对应。

prose:
  paragraph_first: true
  unordered_lists: forbidden
  default_model_evaluation_triple: forbidden

sections:
  problem_restatement: forbidden
  reason: >
    赛委员会推荐不单独写“问题重述”章，以免与题面高度重合、抬高查重。
    必要对象、任务和条件并入问题分析或各问建模，不要整章复述题面。

ordered_lists:
  allowed_for:
    - algorithm_steps
    - formal_assumptions
    - numbered_subproblems_in_analysis

equations:
  boxed_emphasis: forbidden
  forbidden_commands:
    - boxed
    - fbox
    - framebox
    - colorbox

body_length:
  preferred_pages: null
  short_manuscript_triggers: coverage_audit
  padding_forbidden: true

references:
  orphan_entries: forbidden
  in_text_required: true
